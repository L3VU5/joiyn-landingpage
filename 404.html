<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open in Joiyn</title>
    <meta name="theme-color" content="#388F8C" />
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f7f7;
        color: #1a1a1a;
        padding: 24px;
      }
      main {
        max-width: 420px;
        background: #fff;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 16px;
        line-height: 1.5;
        color: #444;
      }
      .actions {
        display: grid;
        gap: 12px;
      }
      a.button {
        display: block;
        text-align: center;
        text-decoration: none;
        background: #388f8c;
        color: #fff;
        padding: 12px 16px;
        border-radius: 12px;
        font-weight: 600;
      }
      a.secondary {
        background: #eef5f5;
        color: #1a1a1a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Open in Joiyn</h1>
      <p id="description">This link opens an event in the Joiyn app.</p>
      <div class="actions">
        <a id="open-app" class="button" href="#">Open app</a>
        <a
          class="button secondary"
          href="https://play.google.com/store/apps/details?id=com.shirocoding.joiyn"
          >Get Joiyn on Google Play</a
        >
        <a
          class="button secondary"
          href="https://apps.apple.com/app/id6773401520"
          >Get Joiyn on the App Store</a
        >
      </div>
    </main>
    <script>
      (function () {
        var path = window.location.pathname || "";
        if (!path.startsWith("/events/")) {
          window.location.replace("https://joiyn.app/");
          return;
        }

        var deepLink =
          "joiyn:/" + path + window.location.search + window.location.hash;
        var openApp = document.getElementById("open-app");
        openApp.href = deepLink;

        var isAndroid = /Android/i.test(navigator.userAgent);
        var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

        if (isAndroid || isIOS) {
          window.location.replace(deepLink);
        }
      })();
    </script>
  </body>
</html>
